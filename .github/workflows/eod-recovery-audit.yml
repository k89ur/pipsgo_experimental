name: EOD Recovery Architecture Audit

on:
  workflow_dispatch:
    inputs:
      max_stale:
        description: "Maximum stale symbols to audit (0 = all)"
        required: false
        default: "0"
  push:
    paths:
      - "tests/test_eod_recovery_comparison.py"
      - ".github/workflows/eod-recovery-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "pandas>=2.0" "requests>=2.31" "yfinance>=0.2.40" "pytest>=8"
      - env:
          RUN_EOD_RECOVERY_AUDIT: "1"
          EOD_RECOVERY_AUDIT_MAX_STALE: ${{ inputs.max_stale || '0' }}
        run: python -m pytest tests/test_eod_recovery_comparison.py -q -s

