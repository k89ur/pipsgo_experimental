name: Final Production Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "pandas>=2.0" "requests>=2.31" "yfinance>=0.2.40" "streamlit>=1.46" "pytest>=8"
      - name: Run final production audit
        env:
          RUN_PRODUCTION_AUDIT: "1"
        run: python -m pytest tests/test_production_audit.py -q -s
