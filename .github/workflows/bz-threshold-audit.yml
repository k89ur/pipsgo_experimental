name: BZ Threshold Impact Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "tests/test_bz_threshold_impact.py"
      - ".github/workflows/bz-threshold-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "pandas>=2.0" "requests>=2.31" "yfinance>=0.2.40" "streamlit>=1.46" "pytest>=8"
      - name: Run BZ threshold impact audit
        env:
          RUN_BZ_THRESHOLD_AUDIT: "1"
        run: python -m pytest tests/test_bz_threshold_impact.py -q -s
