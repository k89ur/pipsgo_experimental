name: BZ SOMANCERA Classification Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "tests/test_bz_somancera_audit.py"
      - ".github/workflows/bz-somancera-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      RUN_BZ_SOMANCERA_AUDIT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "pandas>=2.0" "requests>=2.31" "yfinance>=0.2.40" "streamlit>=1.46" "pytest>=8"
      - name: Run SOMANCERA classification audit
        run: python -m pytest tests/test_bz_somancera_audit.py -q -s
