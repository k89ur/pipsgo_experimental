name: RS Numerical Regression

on:
  workflow_dispatch:
    inputs:
      run_yahoo_benchmark:
        description: "Run the opt-in Yahoo 100/150/200 batch benchmark"
        required: true
        default: false
        type: boolean
      benchmark_symbols:
        description: "Representative NSE symbols for the benchmark"
        required: true
        default: "600"
        type: string
  push:
    paths:
      - "tests/test_adjusted_data_regression.py"
      - ".github/workflows/rs-regression.yml"

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install regression dependencies
        run: python -m pip install --upgrade pip && python -m pip install "numpy>=1.26" "pandas>=2.0" "yfinance>=0.2.40" "pytest>=8"
      - name: Run numerical regression
        env:
          RUN_YAHOO_BATCH_BENCHMARK: ${{ inputs.run_yahoo_benchmark && '1' || '0' }}
          YAHOO_BENCHMARK_SYMBOLS: ${{ inputs.benchmark_symbols }}
        run: python -m pytest tests/test_adjusted_data_regression.py -q -s
