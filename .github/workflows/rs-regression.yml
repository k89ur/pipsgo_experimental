name: RS Numerical Regression

on:
  workflow_dispatch:
  push:
    paths:
      - "tests/test_adjusted_data_regression.py"
      - ".github/workflows/rs-regression.yml"

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install regression dependencies
        run: python -m pip install --upgrade pip && python -m pip install "numpy>=1.26" "pandas>=2.0" "yfinance>=0.2.40" "pytest>=8"
      - name: Run numerical regression
        run: python -m pytest tests/test_adjusted_data_regression.py -q
