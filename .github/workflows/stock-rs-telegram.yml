name: Daily Stock RS Telegram CSV

on:
  schedule:
    # 21:00 Asia/Kolkata (UTC+05:30). GitHub Actions schedule uses UTC.
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stock-rs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Stock RS and send CSV
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python automation/stock_rs_telegram.py
