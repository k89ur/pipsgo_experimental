name: BZ Universe Membership Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "tests/test_bz_universe_audit.py"
      - ".github/workflows/bz-universe-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "pandas>=2.0" "requests>=2.31" "yfinance>=0.2.40" "pytest>=8"
      - env:
          RUN_BZ_UNIVERSE_AUDIT: "1"
        run: python -m pytest tests/test_bz_universe_audit.py -q -s
